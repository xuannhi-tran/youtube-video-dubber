<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Dubber</title>
<style>
:root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#657080; --line:#dfe3e8; --accent:#2563eb; --ok:#15803d; --bad:#b91c1c; --code:#f0f2f5; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#14171c; --card:#1d2128; --text:#e8ebef; --muted:#9aa5b4; --line:#2c323b; --accent:#60a5fa; --ok:#4ade80; --bad:#f87171; --code:#12151a; }
}
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
main { max-width:860px; margin:0 auto; padding:24px 16px 48px; }
h1 { font-size:22px; margin:0 0 4px; }
h2 { font-size:16px; margin:28px 0 10px; }
.sub { color:var(--muted); margin:0 0 18px; }
.card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
form .row { display:flex; gap:8px; }
input[type=text], input[type=number] { width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
select { padding:5px 8px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
button { padding:9px 16px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; white-space:nowrap; }
button.ghost { background:transparent; color:var(--muted); border:1px solid var(--line); padding:4px 10px; font-size:13px; }
button:disabled { opacity:.5; cursor:default; }
.opts { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:12px; align-items:center; color:var(--muted); font-size:14px; }
.opts label { display:flex; gap:6px; align-items:center; }
.opts input[type=number] { width:80px; padding:5px 8px; }
.err { color:var(--bad); margin-top:8px; min-height:1.2em; font-size:14px; }
.head { display:flex; justify-content:space-between; gap:10px; align-items:center; }
.url { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.badge { font-size:12px; padding:2px 8px; border-radius:99px; border:1px solid var(--line); color:var(--muted); white-space:nowrap; }
.badge.paused { color:#b45309; }
.badge.done { color:var(--ok); } .badge.failed { color:var(--bad); } .badge.running { color:var(--accent); }
.steps { display:flex; gap:6px; margin:10px 0 4px; }
.steps span { flex:1; height:6px; border-radius:3px; background:var(--line); }
.steps span.on { background:var(--accent); } .steps span.now { background:var(--accent); opacity:.55; }
.note { color:var(--muted); font-size:13px; }
.progress { height:7px; border-radius:8px; background:var(--line); overflow:hidden; margin:8px 0 4px; }
.progress i { display:block; height:100%; background:var(--accent); transition:width .25s; }
details { margin-top:12px; color:var(--muted); font-size:14px; }
summary { cursor:pointer; }
.review-line { border-top:1px solid var(--line); padding:8px 0; }
.error-title { color:var(--bad); font-weight:600; }
pre { background:var(--code); border-radius:8px; padding:8px 10px; margin:8px 0 0; font:12px/1.45 ui-monospace,Consolas,monospace; max-height:150px; overflow:auto; white-space:pre-wrap; word-break:break-word; }
video { width:100%; max-height:420px; background:#000; border-radius:8px; margin-top:8px; }
a { color:var(--accent); }
.vid { display:flex; justify-content:space-between; gap:10px; align-items:center; }
</style>
</head>
<body>
<main>
  <h1>YouTube Dubber</h1>
  <p class="sub">Dán link video tiếng Trung, trang này tự dịch, lồng tiếng Việt và xuất video hoàn chỉnh.</p>

  <form id="form" class="card">
    <div class="row">
      <input id="url" type="text" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" required>
      <button id="go" type="submit">Làm video</button>
    </div>
    <div class="opts">
      <label>Người nói
        <select id="speaker" title="Giúp dịch đúng cách xưng hô; nếu .env có TTS_VOICE_FEMALE / TTS_VOICE_MALE thì đọc bằng giọng đó">
          <option value="">Như lần trước / tự đoán</option>
          <option value="female">Nữ</option>
          <option value="male">Nam</option>
          <option value="auto">Tự đoán (bỏ lựa chọn cũ)</option>
        </select>
      </label>
    </div>
    <details><summary>Tuỳ chọn nâng cao</summary><div class="opts">
      <label><input id="subs" type="checkbox"> Thêm phụ đề tiếng Việt (dải đen dưới video)</label>
      <label>Âm gốc <input id="vol" type="number" min="0" max="1" step="0.01" placeholder="0.02"></label>
      <label>Chỉ thử <input id="secs" type="number" min="1" step="1" placeholder="hết"> giây đầu</label>
    </div></details>
    <div id="err" class="err"></div>
  </form>

  <h2>Đang làm</h2>
  <div id="jobs"><p class="note">Chưa có link nào.</p></div>

  <h2>Video đã xong</h2>
  <div id="videos"><p class="note">Chưa có video nào.</p></div>
</main>
<script>
const STEPS = ["Tải video", "Dịch", "Đọc giọng", "Ghép nhịp", "Xuất video"];
const STATUS = {waiting:"Đang chờ", running:"Đang chạy", paused:"Hết limit", done:"Xong", failed:"Lỗi", cancelled:"Đã hủy"};
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

$("form").addEventListener("submit", async ev => {
  ev.preventDefault();
  $("err").textContent = "";
  const body = {url: $("url").value, subs: $("subs").checked, original_volume: $("vol").value, max_seconds: $("secs").value,
                speaker: $("speaker").value};
  const res = await fetch("/api/jobs", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  const data = await res.json();
  if (!res.ok) { $("err").textContent = data.error || "Lỗi"; return; }
  $("url").value = "";
  refresh();
});

async function act(id, action) {
  await fetch(`/api/jobs/${id}/${action}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
  refresh();
}
function button(text, onclick, ghost) {
  const b = el("button", ghost ? "ghost" : "", text); b.onclick = onclick; return b;
}

function renderJob(job) {
  const card = el("div", "card");
  const head = el("div", "head");
  head.append(el("div", "url", job.url), el("span", "badge " + job.status, STATUS[job.status]));
  card.append(head);
  if (job.status === "running" || job.status === "done" || job.status === "paused") {
    const bar = el("div", "steps");
    STEPS.forEach((_, i) => bar.append(el("span", job.status === "done" || i + 1 < job.stage ? "on" : (i + 1 === job.stage ? "now" : ""))));
    card.append(bar);
    const label = job.status === "done" ? "Xong tất cả các bước" : (job.stage ? `Bước ${job.stage}/5: ${STEPS[job.stage - 1]}` : "Đang khởi động...");
    card.append(el("div", "note", label));
    const elapsed = `${Math.floor(job.elapsed / 60)} phút ${job.elapsed % 60} giây`;
    let progressLabel = `Đã chạy ${elapsed}`;
    let percent = job.status === "done" ? 100 : 0;
    if (job.stage_name === "speech" && job.speech_progress?.total) {
      const p = job.speech_progress;
      percent = Math.min(100, Math.round(p.done * 100 / p.total));
      progressLabel = `Đọc giọng ${p.done}/${p.total} đoạn · ${elapsed}`;
    } else if (job.stage && job.status !== "done") {
      percent = Math.min(94, Math.round(((job.stage - 1) / 5) * 100));
    }
    card.append(el("div", "progress", ""));
    card.lastChild.append(el("i", "", "")); card.lastChild.firstChild.style.width = `${percent}%`;
    card.append(el("div", "note", progressLabel));
  }
  if (job.status === "paused") {
    card.append(el("div", "note", "Model hết limit nên job dừng ở đây, phần đã dịch được giữ lại. Các link sau chưa chạy cho tới khi bạn bấm tiếp tục."));
    card.append(el("div", "note", job.error));
    const row = el("div", "opts");
    row.append(button("Tiếp tục job này", () => act(job.id, "resume")), button("Bỏ job này, làm link kế", () => act(job.id, "cancel"), true));
    card.append(row);
  }
  if (job.status === "done" && job.hold) {
    card.append(el("div", "note", "Video đã xong nhưng model rút gọn hết limit nên một số câu chưa được rút gọn (được tăng tốc nhẹ thay thế). Hàng chờ đang dừng."));
    card.append(el("div", "note", job.warning));
    const row = el("div", "opts");
    row.append(button("Tiếp tục hàng chờ", () => act(job.id, "resume")));
    card.append(row);
  }
  if (job.status === "failed") {
    card.append(el("div", "error-title", job.error_summary || "Job bị lỗi."));
    card.append(el("div", "note", "Chạy lại sẽ tiếp tục từ các bước đã lưu."));
    card.append(el("div", "opts", ""));
    card.lastChild.append(button("Chạy lại", async () => { await act(job.id, "retry"); }));
  }
  if (job.review_report) {
    const report = el("details");
    report.append(el("summary", "", `Model review đã rà ${job.review_report.reviewed} đoạn`));
    job.review_report.lines.forEach(line => {
      const row = el("div", "review-line");
      row.append(el("strong", "", `Đoạn ${line.id}${line.changed ? " · bản cuối khác bản dịch ban đầu" : " · giữ nguyên"}`));
      row.append(el("div", "note", `Bản dịch ban đầu: ${line.before}`));
      row.append(el("div", "note", `Bản sau fit/review: ${line.after}`));
      report.append(row);
    });
    card.append(report);
  }
  if (job.log.length && job.status !== "waiting") {
    const log = el("pre", "", job.log.join("\n"));
    log.dataset.job = job.id;
    if (job.status === "failed") {
      const details = el("details"); details.append(el("summary", "", "Xem log kỹ thuật"), log); card.append(details);
    } else card.append(log);
  }
  if (job.status === "waiting" || job.status === "running") {
    const b = button("Hủy", () => act(job.id, "cancel"), true);
    card.append(el("div", "", "")); card.lastChild.style.marginTop = "8px"; card.lastChild.append(b);
  }
  if (job.status === "done") card.append(el("div", "note", "Video nằm ở mục “Video đã xong” bên dưới."));
  return card;
}

function playerFor(id) {
  const wrap = el("div");
  const v = document.createElement("video");
  v.controls = true; v.preload = "metadata"; v.src = "/video/" + encodeURIComponent(id);
  const link = el("a", "", "Tải về dubbed.mp4"); link.href = "/video/" + encodeURIComponent(id) + "?download=1";
  wrap.append(v, el("div", "note", ""));
  wrap.lastChild.append(link);
  return wrap;
}

let lastJobs = "", lastVideos = "";
async function refresh() {
  let data;
  try { data = await (await fetch("/api/state")).json(); } catch { return; }
  // Jobs and videos are drawn separately, so a busy job log never rebuilds an open player.
  const jobsKey = JSON.stringify(data.jobs), videosKey = JSON.stringify(data.videos);
  if (jobsKey !== lastJobs) {
    lastJobs = jobsKey;
    const jobs = $("jobs");
    // The logs are rebuilt on every update: remember where each one was scrolled (and the page too),
    // follow the end of a log unless the reader scrolled up, and put everything back afterwards.
    const kept = {};
    jobs.querySelectorAll("pre[data-job]").forEach(pre => {
      kept[pre.dataset.job] = {top: pre.scrollTop, bottom: pre.scrollHeight - pre.scrollTop - pre.clientHeight < 8};
    });
    const pageTop = window.scrollY;
    jobs.replaceChildren();
    if (!data.jobs.length) jobs.append(el("p", "note", "Chưa có link nào."));
    [...data.jobs].reverse().forEach(j => jobs.append(renderJob(j)));
    jobs.querySelectorAll("pre[data-job]").forEach(pre => {
      const was = kept[pre.dataset.job];
      pre.scrollTop = was && !was.bottom ? was.top : pre.scrollHeight;
    });
    window.scrollTo(0, pageTop);
  }
  if (videosKey !== lastVideos) {
    lastVideos = videosKey;
    const list = $("videos"); list.replaceChildren();
    if (!data.videos.length) list.append(el("p", "note", "Chưa có video nào."));
    data.videos.forEach(v => {
      const card = el("div", "card");
      const row = el("div", "vid");
      const folder = v.folder_size > v.size * 1.1 ? `  ·  cả thư mục ${(v.folder_size / 1e6).toFixed(0)} MB` : "";
      row.append(el("div", "url", `${v.video_id}  ·  ${(v.size / 1e6).toFixed(1)} MB${folder}  ·  ${new Date(v.time * 1000).toLocaleString("vi-VN")}`));
      const open = el("button", "ghost", "Xem"); open.onclick = () => { open.replaceWith(playerFor(v.video_id)); };
      const del = el("button", "ghost", "Xóa");
      del.onclick = async () => {
        const after = v.exported ? `Bản chép ở ${v.exported} vẫn được giữ.` : "Video chưa được chép đi đâu: muốn có lại phải làm từ đầu.";
        if (!confirm(`Xóa hẳn video ${v.video_id} và cả thư mục của nó trên máy (${((v.folder_size || v.size) / 1e6).toFixed(0)} MB)?\n\n${after}`)) return;
        // An open player keeps the file busy on Windows, which would stop the folder from being deleted.
        card.querySelectorAll("video").forEach(video => { video.pause(); video.removeAttribute("src"); video.load(); });
        const res = await fetch(`/api/videos/${encodeURIComponent(v.video_id)}/delete`, {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
        if (!res.ok) alert((await res.json()).error || "Không xóa được");
        refresh();
      };
      const buttons = el("div", "opts"); buttons.append(open, del);
      row.append(buttons); card.append(row);
      if (v.exported) card.append(el("div", "note", `Đã chép sang thư mục đồng bộ: ${v.exported}`));
      list.append(card);
    });
  }
}
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
